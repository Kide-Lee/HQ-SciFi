# 三平台出包（迁移计划 P5）。
#
# 触发：推 tag `v*` 或手动。CI（ci.yml）只做门禁，不出包。
#
# 前置：
#   - 渲染层用 npm 构建（`npm run build` → out/renderer），Tauri 的 frontendDist 指向它；
#   - `api.config.json` 不入库（见 .gitignore），CI 里用 `api.config.example.json` 兜底，
#     真实发布前必须由维护者在 secrets/构建机里提供正式配置——**否则装出来的客户端连的是示例地址**。

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（不带 v，例如 2.0.0）"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            artifact: linux
          - platform: windows-latest
            args: "--bundles nsis"
            artifact: windows
          - platform: macos-latest
            args: "--bundles dmg"
            artifact: macos

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 构建渲染层（Tauri 的 frontendDist）
        run: npm run build

      - name: 准备 api.config.json（CI 兜底）
        shell: bash
        run: |
          if [ ! -f api.config.json ]; then
            cp api.config.example.json api.config.json
            echo "::warning::未提供正式 api.config.json，包内使用 api.config.example.json 的地址"
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: 构建并上传 Release 产物
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "黄芪饮片 ${{ github.ref_name }}"
          releaseBody: "见 doc/CHANGELOG.md"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}