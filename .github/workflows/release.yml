# 三平台出包（迁移计划 P5）。
#
# 触发：
#   - 推 tag `v*`            → 构建 + 创建 draft Release（正式发布流程）
#   - 推分支 `build-only`    → 只构建 + 上传 artifacts，**不创建 Release**（打包验证用）
#   - 手动 workflow_dispatch → version 必填；dry_run=true 时同样不创建 Release
#
# 前置与坑（与 ci.yml 同源，均已在下面显式处理）：
#   - `src-tauri/src/commands_generated.rs` 是 gitignored 生成物 → 构建前必须 `--write`；
#   - `src-tauri/resources/*` 是 gitignored 生成物，且 `tauri.conf.json` 的
#     `bundle.resources` 在编译期校验存在 → 必须先跑 `prepare-resources.mjs`；
#   - `api.config.json` 不入库：正式发布用仓库 secret `HQSF_API_CONFIG_B64`
#     （本地 api.config.json 的 base64）注入；未配置时退回 `api.config.example.json`
#     并告警——那样装出来的客户端连的是示例地址；
#   - 本仓没有 `@tauri-apps/cli` 依赖（也不要为了它改 package-lock），
#     所以用 `cargo install tauri-cli` + `cargo tauri build`，不经过 npm 脚本。

name: release

on:
  push:
    tags: ["v*"]
    branches: ["build-only"]
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（不带 v，例如 2.0.14）"
        required: true
      dry_run:
        description: "只构建、不创建 Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 打包验证分支与 dry_run 都不建 Release；tag 推送时用 tag 名。
  IS_DRY_RUN: ${{ github.ref_name == 'build-only' || inputs.dry_run }}
  RELEASE_TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            artifact: linux
          - platform: windows-latest
            args: "--bundles nsis"
            artifact: windows
          # macOS 只在 arm64 runner 上跑，用 `--target` 交叉出 x64 dmg
          # （`macos-13` 这类 Intel runner 已排不到；与 1.x 的 x64/arm64 两个 dmg 对齐）。
          - platform: macos-latest
            args: "--bundles dmg --target aarch64-apple-darwin"
            artifact: macos-arm64
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: "--bundles dmg --target x86_64-apple-darwin"
            artifact: macos-x64
            rust_target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # 渲染层用**纯 Vite**构建（`vite.web.config.ts`），不再依赖 electron-vite：
      # 产物在 `out/web`，即 `src-tauri/tauri.conf.json` 的 `frontendDist`。
      # 这样 1.x Electron 主进程（out/main、out/preload）与 Tauri 出包彻底解耦。
      - name: 构建渲染层（Tauri 的 frontendDist）
        run: npm run build:web

      - name: 准备 api.config.json
        shell: bash
        # 优先级：仓库 secret（正式发布用）> 工作区已有文件 > 示例配置兜底。
        # 设置方式：把本地 api.config.json 做 base64 后存为仓库 secret `HQSF_API_CONFIG_B64`。
        env:
          API_CONFIG_B64: ${{ secrets.HQSF_API_CONFIG_B64 }}
        run: |
          if [ -n "${API_CONFIG_B64:-}" ]; then
            printf '%s' "$API_CONFIG_B64" | base64 -d > api.config.json
            python3 -c "import json,sys;d=json.load(open('api.config.json'));print('配置来源: secret HQSF_API_CONFIG_B64, baseUrl =', d.get('baseUrl'), ', endpoints =', len(d.get('endpoints',{})))"
            echo "::notice::使用仓库 secret HQSF_API_CONFIG_B64 作为 api.config.json"
          elif [ -f api.config.json ]; then
            echo "::notice::使用工作区已有的 api.config.json"
          else
            cp api.config.example.json api.config.json
            echo "::warning::未配置 secret HQSF_API_CONFIG_B64，包内使用示例配置——安装后连不通真实服务"
            echo "### ⚠️ 本版安装包使用示例 API 配置" >> "$GITHUB_STEP_SUMMARY"
            echo "未提供 `HQSF_API_CONFIG_B64` secret，安装包内的 API 地址是示例地址。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 两个 gitignored 生成物：缺任何一个都会在 `cargo tauri build` 里失败。
      - name: 生成 dispatch（gitignored 产物）
        run: node src-tauri/scripts/gen-tauri-commands.mjs --write

      - name: 生成打包资源（gitignored 产物）
        run: node src-tauri/scripts/prepare-resources.mjs

      - uses: dtolnay/rust-toolchain@stable

      - name: 追加交叉编译目标
        if: matrix.rust_target
        run: rustup target add ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            xvfb xdotool dbus-x11 imagemagick libfuse2

      - name: 安装 tauri-cli（cargo 版，避免引入 @tauri-apps/cli 依赖）
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建安装包
        working-directory: src-tauri
        run: cargo tauri build ${{ matrix.args }}

      # 装出来的东西对不对：版本号、系统依赖、包内资源、bundle id。
      # 打 tag 时还会把 tag 号和 tauri.conf.json 的 version 对齐检查。
      - name: 产物自检（版本 / 依赖 / 资源 / bundle id）
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/meta"
          set -o pipefail
          if [[ "$RELEASE_TAG" == v* ]]; then
            node scripts/verify-bundles.mjs --expect-version "${RELEASE_TAG#v}" 2>&1 | tee "$RUNNER_TEMP/meta/verify.txt"
          else
            node scripts/verify-bundles.mjs 2>&1 | tee "$RUNNER_TEMP/meta/verify.txt"
          fi

      # AppImage 是 Linux 用户最常下载的格式，但它没被 ci.yml 的 smoke 覆盖
      # （那边跑的是 --no-bundle 的裸二进制）。这里真跑一次 AppImage：
      # 同时验证 type2 runtime / FUSE 挂载 / 打包后的资源路径都对。
      - name: 冒烟（AppImage，Xvfb）
        id: appimage_smoke
        if: matrix.platform == 'ubuntu-22.04'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/meta"
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1 | tee "$RUNNER_TEMP/meta/appimage-path.txt")
          chmod +x "$APPIMAGE"
          export HOME="$RUNNER_TEMP/appimage-home"
          mkdir -p "$HOME"
          xvfb-run -a -s "-screen 0 1280x800x24" \
            dbus-run-session -- bash scripts/smoke-tauri.sh "$APPIMAGE" 2>&1 \
            | tee "$RUNNER_TEMP/meta/appimage-smoke.log"

      # 失败时把冒烟日志推到一个分支：Actions 日志接口要 admin，只有 git 协议稳定可读。
      - name: 回写 AppImage 冒烟日志
        if: always() && matrix.platform == 'ubuntu-22.04' && steps.appimage_smoke.outcome != 'skipped'
        run: |
          mkdir -p "$RUNNER_TEMP/release-logs" && cd "$RUNNER_TEMP/release-logs"
          git init -q && git checkout -q -b release-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          {
            echo "# AppImage 冒烟"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- outcome: ${{ steps.appimage_smoke.outcome }}"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat "$RUNNER_TEMP/meta/appimage-smoke.log" 2>/dev/null || echo "(无日志)"
            echo '```'
          } > README.md
          git add README.md
          git commit -qm "release: appimage smoke ${{ steps.appimage_smoke.outcome }} for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" release-logs

      - name: 冒烟失败则整包失败
        if: steps.appimage_smoke.outcome == 'failure'
        run: exit 1

      # 先用 glob 抓 bundle 目录（不依赖手写矩阵路径），产物缺失时这一步就会红。
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/*/release/bundle/
          if-no-files-found: error

      # 只做记录，不允许它把已经成功的打包判成失败（首跑就是被它挡掉的）。
      - name: 记录产物大小
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/meta"
          {
            find src-tauri/target -type f -path '*/bundle/*' \
              \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) \
              -exec du -h {} + || true
          } > "$RUNNER_TEMP/meta/sizes.txt" 2>&1
          cat "$RUNNER_TEMP/meta/sizes.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/meta/sizes.txt
            ${{ runner.temp }}/meta/verify.txt
            ${{ runner.temp }}/meta/appimage-smoke.log
          if-no-files-found: warn

  # 正式流程才建 Release；`build-only` 分支与 dry_run 只留 artifacts（保留 14 天）。
  release:
    needs: build
    if: github.ref_name != 'build-only' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true

      # 用 gh CLI 而不是第三方 action：失败原因要能回写到分支。
      # （本机 api.github.com 匿名只有 60 次/小时，Actions 日志接口要 admin。）
      - name: 创建 draft Release
        id: create_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/release.log"
          {
            echo "tag: $RELEASE_TAG"
            echo "dist 下的产物："
            find dist -type f | sort | sed 's/^/  /' | head -100
            du -sh dist 2>&1 | sed 's/^/  /'
          } > "$LOG"
          mapfile -t files < <(find dist -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "dist 下没有产物文件，拒绝创建 Release" | tee -a "$LOG"
            exit 1
          fi
          echo "上传 ${#files[@]} 个文件" >> "$LOG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release 已存在，改为覆盖上传产物" >> "$LOG"
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber >> "$LOG" 2>&1
          else
            gh release create "$RELEASE_TAG" \
              --draft --title "黄芪饮片 $RELEASE_TAG" \
              --notes "见 doc/CHANGELOG.md" \
              "${files[@]}" >> "$LOG" 2>&1
          fi
          tail -5 "$LOG"

      - name: 回写 Release 结论（失败时含原因）
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/status" && cd "$RUNNER_TEMP/status"
          git init -q && git checkout -q -b release-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          {
            echo "# Release 创建"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- tag: $RELEASE_TAG"
            echo "- outcome: ${{ steps.create_release.outcome }}"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat "$RUNNER_TEMP/release.log" 2>/dev/null || echo "(无日志)"
            echo '```'
          } > README.md
          git add README.md
          git commit -qm "release: create=${{ steps.create_release.outcome }} for ${GITHUB_SHA:0:7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" release-logs

      - name: 创建失败则整轮失败
        if: steps.create_release.outcome == 'failure'
        run: exit 1

  # 结论回写：本机只有 api.github.com（匿名 60/h）且 Actions 运行/日志接口要 admin，
  # 所以用 `git ls-remote origin release-status` + commit message 判断三平台打包结果。
  status:
    needs: [build, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # 产物大小只存在于 artifacts 里（Actions 日志要 admin），所以顺手并进状态分支，
      # 否则「安装包变小了多少」这个迁移主收益无法从 CI 侧核实。
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: meta
          pattern: meta-*

      - name: 回写 release-status 分支
        run: |
          mkdir -p "$RUNNER_TEMP/status" && cd "$RUNNER_TEMP/status"
          git init -q && git checkout -q -b release-status
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          {
            echo "# 三平台打包"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- ref: $GITHUB_REF"
            echo "- build: ${{ needs.build.result }}"
            echo "- release: ${{ needs.release.result }}"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "## 产物大小"
            echo
            # 注意：这里已 cd 到 $RUNNER_TEMP/status，artifacts 解在工作区根。
            for f in "$GITHUB_WORKSPACE"/meta/*/sizes.txt; do
              [ -f "$f" ] || continue
              echo "### $(basename "$(dirname "$f")")"
              echo '```'
              cat "$f"
              echo '```'
            done
            echo
            echo "## 产物自检"
            echo
            for f in "$GITHUB_WORKSPACE"/meta/*/verify.txt; do
              [ -f "$f" ] || continue
              echo "### $(basename "$(dirname "$f")")"
              echo '```'
              cat "$f"
              echo '```'
            done
          } > README.md
          git add README.md
          git commit -qm "release: build=${{ needs.build.result }} for ${GITHUB_SHA:0:7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" release-status