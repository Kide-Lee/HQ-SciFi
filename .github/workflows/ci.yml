# CI 门禁：每次 push / PR 都验证「逻辑级完成」
#
# 迁移计划 §7 的验收边界：本机（沙箱）能验的那部分在这里也必须能验——
# 内核单测、clippy、fmt、绑定漂移、TS 类型检查；`src-tauri` 的编译需要
# WebKitGTK，单独一个 job 装系统依赖后 `cargo check`。
#
# 注意：根 Cargo.toml 的 workspace **不包含** src-tauri（本机无 WebKitGTK 时
# 不能让 `cargo test` 被它拖死），所以壳层要显式 `--manifest-path`。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# 壳层 job 在编译失败时会把 `cargo check` 输出推到 `ci-logs` 分支（见下方「诊断」步骤），
# 供没有仓库 admin 权限的调用方（含本机 agent）读取——GitHub 的 job logs API 需要 admin，
# 而 CI 自己带 `GITHUB_TOKEN`。除此之外 CI 只读仓库。
permissions:
  contents: write

jobs:
  core:
    name: 内核（fmt / clippy / test / 绑定漂移）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rusqlite 用 bundled，但仍然需要 C 工具链（ubuntu 镜像自带）。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      # 绑定生成物必须与 Rust 类型/命令表一致；漂移即失败（防止手改生成文件）。
      - name: 绑定漂移检查
        run: cargo run -q -p hqsf-bindings -- --check

  tsc:
    name: TS 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 迁移期双轨守门：渲染层与桥接层必须保持「无 Electron」，
      # 否则以后删 `src/main` 时会突然断裂（这正是迁移能随时收尾的前提）。
      - name: 渲染层不得引用 Electron
        shell: bash
        run: |
          if grep -rn -E "from ['\"]electron['\"]|require\(['\"]electron['\"]\)" src/renderer src/bridge; then
            echo "::error::渲染层/桥接层不得依赖 electron（迁移期双轨守门）"
            exit 1
          fi
          echo "渲染层与桥接层无 Electron 依赖"

      - run: npm run typecheck

  shell:
    name: 壳层（生成 dispatch + 契约校验 + cargo check，需要 WebKitGTK）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `src-tauri/src/commands_generated.rs` 是 gitignored 的生成物：编译前必须先落盘。
      - name: 生成 85 条命令 dispatch（gitignored 产物）
        run: node src-tauri/scripts/gen-tauri-commands.mjs --write

      # 不依赖 Rust 的契约门禁：85 条通道各一次、命令名==契约、参数名（camelCase）与
      # 整包结构体字段覆盖契约参数、register() 覆盖全部命令、生成物无漂移。
      - name: 契约静态校验（不含编译）
        run: node src-tauri/scripts/gen-tauri-commands.mjs --verify

      - name: 脚本语法检查
        run: |
          node --check src-tauri/scripts/gen-tauri-commands.mjs
          node --check src-tauri/scripts/prepare-resources.mjs

      # `tauri.conf.json` 的 `bundle.resources` 在**编译期**就会校验源文件存在，
      # 而 `src-tauri/resources/*` 是 prepare-resources.mjs 的生成物（gitignored）：
      # 检出后必须先生成，否则 `cargo check` 直接报
      # `resource path resources/agreement.md doesn't exist`。
      # `api.config.json` 不入库，CI 用 example 兜底（真实发布会由维护者提供正式配置）。
      - name: 准备打包资源（gitignored 生成物）
        run: |
          if [ ! -f api.config.json ]; then
            echo "::warning::CI 使用 api.config.example.json 作为 api.config.json 兜底"
            cp api.config.example.json api.config.json
          fi
          node src-tauri/scripts/prepare-resources.mjs

      - run: npm ci

      # `tauri::generate_context!()` 在编译期把 `frontendDist`（`../out/web`）嵌进二进制，
      # 目录不存在会直接编译失败；因此这里先产出前端产物（资源文件上一步已生成）
      - name: 前端产物（编译期被嵌入）
        run: npm run build:web

      # 只做类型/借用检查，不出包。
      # 输出同时 tee 到文件：失败时下一步把编译错误推到 `ci-logs` 分支，便于在无 admin 权限的
      # 环境下读到完整错误（本机沙箱没有 WebKitGTK，无法本地复现壳层编译）。
      - name: cargo check
        id: shell_check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets 2>&1 | tee "$RUNNER_TEMP/check.log"

      # 把 cargo 输出与结论回写到 `ci-logs` 分支（always）：本机沙箱只有 api.github.com 可达、
      # 且有 60 次/小时的匿名限额，抓不到 Actions 日志时可以直接 `git ls-remote` 看结论。
      - name: 状态回写（ci-logs 分支）
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          cd "$RUNNER_TEMP/diag"
          git init -q
          git checkout -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          {
            echo "# 壳层 cargo check"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- outcome: ${{ steps.shell_check.outcome }}"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/check.log" ]; then
              tail -c 200000 "$RUNNER_TEMP/check.log"
            else
              echo "(cargo check 未执行，无输出)"
            fi
            echo '```'
          } > README.md
          git add README.md
          git commit -qm "ci: shell check ${{ steps.shell_check.outcome }} for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      # 把失败状态传递下去（continue-on-error 只是为了让「诊断」步骤有机会跑）。
      - name: 失败传递
        if: steps.shell_check.outcome == 'failure'
        run: exit 1

  # 启动冒烟：把 Tauri 应用在 Linux runner 上真的跑起来（本机没有 WebKitGTK，只能在这里证明）。
  smoke:
    name: 启动冒烟（Xvfb）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config xvfb xdotool dbus-x11 imagemagick

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 构建渲染层
        run: npm run build:web

      - name: 准备 api.config.json（CI 兜底）
        shell: bash
        run: |
          if [ ! -f api.config.json ]; then
            cp api.config.example.json api.config.json
            echo "::warning::未提供正式 api.config.json，冒烟用示例地址"
          fi

      - run: node src-tauri/scripts/gen-tauri-commands.mjs --write

      - run: node src-tauri/scripts/prepare-resources.mjs

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建（不打包，只要可执行文件）
        working-directory: src-tauri
        run: cargo tauri build --no-bundle

      - name: 启动冒烟
        id: smoke_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          export HOME="$RUNNER_TEMP/apphome"
          mkdir -p "$HOME"
          xvfb-run -a -s "-screen 0 1280x800x24" \
            dbus-run-session -- bash scripts/smoke-tauri.sh 2>&1 | tee "$RUNNER_TEMP/smoke.log"

      # 冒烟失败时的可读输出（日志接口要 admin，只能回写到分支）。
      - name: 回写冒烟日志
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-status" && cd "$RUNNER_TEMP/smoke-status"
          git init -q && git checkout -q -b smoke-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          {
            echo "# 启动冒烟"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- outcome: ${{ steps.smoke_check.outcome }}"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/smoke.log" ]; then
              tail -c 200000 "$RUNNER_TEMP/smoke.log"
            else
              echo "(冒烟未产生输出)"
            fi
            echo '```'
          } > README.md
          git add README.md
          git commit -qm "ci: smoke ${{ steps.smoke_check.outcome }} for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke-logs

      - name: 失败传递
        if: steps.smoke_check.outcome == 'failure'
        run: exit 1

  # 端到端：tauri-driver（Linux 后端 WebKitWebDriver）驱动真实应用做断言。
  # 这是 1.x 时代 CDP 脚本的替代物——WebKitGTK 没有 CDP，官方自动化路径就是 W3C WebDriver。
  # 与 smoke 的分工：smoke 只证明「进程活着 + 有窗口 + 不白屏」；这里证明「渲染层跑到哪一步、
  # 桥接层就绪、右键菜单被接管、__hqsf_log 真的落盘」。
  e2e:
    name: 端到端（tauri-driver）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux 系统依赖（含 WebKitWebDriver）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config xvfb dbus-x11 webkit2gtk-driver curl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 构建渲染层
        run: npm run build:web

      - name: 准备 api.config.json（CI 兜底）
        shell: bash
        run: |
          if [ ! -f api.config.json ]; then
            cp api.config.example.json api.config.json
            echo "::warning::未提供正式 api.config.json，E2E 用示例地址"
          fi

      - run: node src-tauri/scripts/gen-tauri-commands.mjs --write

      - run: node src-tauri/scripts/prepare-resources.mjs

      - name: 安装 tauri-driver
        run: cargo install tauri-driver --locked

      - name: 构建调试版应用（tauri-driver 要求）
        working-directory: src-tauri
        run: cargo build --features devtools

      - name: 端到端断言
        id: e2e_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          export HOME="$RUNNER_TEMP/e2ehome"
          mkdir -p "$HOME"
          export APP_BIN="$(realpath src-tauri/target/debug/huangqi-scifi)"
          xvfb-run -a -s "-screen 0 1280x800x24" \
            dbus-run-session -- bash scripts/e2e/run.sh 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: 上传证据（截图 + 驱动日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: .e2e
          if-no-files-found: warn

      - name: 回写 E2E 日志
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-status" && cd "$RUNNER_TEMP/e2e-status"
          git init -q && git checkout -q -b e2e-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          {
            echo "# 端到端（tauri-driver）"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- outcome: ${{ steps.e2e_check.outcome }}"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/e2e.log" ]; then
              tail -c 200000 "$RUNNER_TEMP/e2e.log"
            else
              echo "(E2E 未产生输出)"
            fi
            echo '```'
          } > README.md
          git add README.md
          git commit -qm "ci: e2e ${{ steps.e2e_check.outcome }} for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" e2e-logs

      - name: 失败传递
        if: steps.e2e_check.outcome == 'failure'
        run: exit 1

  # 汇总三层闸门 + 冒烟的结论并推到 `ci-status` 分支：本机只有 api.github.com（且匿名限额 60/h），
  # Actions 日志接口要 admin，所以用 `git ls-remote origin ci-status` + commit message 读结论。
  # 壳层 cargo 输出详情仍在 `ci-logs` 分支（shell job 自己回写）。
  status:
    name: 汇总状态（回写 ci-status 分支）
    needs: [core, tsc, shell, smoke, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 回写结论
        run: |
          mkdir -p "$RUNNER_TEMP/status" && cd "$RUNNER_TEMP/status"
          git init -q && git checkout -q -b ci-status
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          {
            echo "# CI 结论"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- core: ${{ needs.core.result }}"
            echo "- tsc: ${{ needs.tsc.result }}"
            echo "- shell: ${{ needs.shell.result }}"
            echo "- smoke: ${{ needs.smoke.result }}"
            echo "- e2e: ${{ needs.e2e.result }}"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > README.md
          git add README.md
          git commit -qm "ci: core=${{ needs.core.result }} tsc=${{ needs.tsc.result }} shell=${{ needs.shell.result }} smoke=${{ needs.smoke.result }} e2e=${{ needs.e2e.result }} for ${GITHUB_SHA:0:7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-status

  # 三平台出包在 release.yml（tag 触发），CI 不跑，省时间。
