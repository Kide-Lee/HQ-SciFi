# CI 门禁：每次 push / PR 都验证「逻辑级完成」
#
# 迁移计划 §7 的验收边界：本机（沙箱）能验的那部分在这里也必须能验——
# 内核单测、clippy、fmt、绑定漂移、TS 类型检查；`src-tauri` 的编译需要
# WebKitGTK，单独一个 job 装系统依赖后 `cargo check`。
#
# 注意：根 Cargo.toml 的 workspace **不包含** src-tauri（本机无 WebKitGTK 时
# 不能让 `cargo test` 被它拖死），所以壳层要显式 `--manifest-path`。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: 内核（fmt / clippy / test / 绑定漂移）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rusqlite 用 bundled，但仍然需要 C 工具链（ubuntu 镜像自带）。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      # 绑定生成物必须与 Rust 类型/命令表一致；漂移即失败（防止手改生成文件）。
      - name: 绑定漂移检查
        run: cargo run -q -p hqsf-bindings -- --check

  tsc:
    name: TS 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  shell:
    name: 壳层（cargo check，需要 WebKitGTK）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # 只做类型/借用检查，不出包。
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  # 三平台出包在 release.yml（tag 触发），CI 不跑，省时间。