# CI 门禁：每次 push / PR 都验证「逻辑级完成」
#
# 迁移计划 §7 的验收边界：本机（沙箱）能验的那部分在这里也必须能验——
# 内核单测、clippy、fmt、绑定漂移、TS 类型检查；`src-tauri` 的编译需要
# WebKitGTK，单独一个 job 装系统依赖后 `cargo check`。
#
# 注意：根 Cargo.toml 的 workspace **不包含** src-tauri（本机无 WebKitGTK 时
# 不能让 `cargo test` 被它拖死），所以壳层要显式 `--manifest-path`。

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# 壳层 job 在编译失败时会把 `cargo check` 输出推到 `ci-logs` 分支（见下方「诊断」步骤），
# 供没有仓库 admin 权限的调用方（含本机 agent）读取——GitHub 的 job logs API 需要 admin，
# 而 CI 自己带 `GITHUB_TOKEN`。除此之外 CI 只读仓库。
permissions:
  contents: write

jobs:
  core:
    name: 内核（fmt / clippy / test / 绑定漂移）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rusqlite 用 bundled，但仍然需要 C 工具链（ubuntu 镜像自带）。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      # 绑定生成物必须与 Rust 类型/命令表一致；漂移即失败（防止手改生成文件）。
      - name: 绑定漂移检查
        run: cargo run -q -p hqsf-bindings -- --check

  tsc:
    name: TS 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  shell:
    name: 壳层（生成 dispatch + 契约校验 + cargo check，需要 WebKitGTK）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `src-tauri/src/commands_generated.rs` 是 gitignored 的生成物：编译前必须先落盘。
      - name: 生成 85 条命令 dispatch（gitignored 产物）
        run: node src-tauri/scripts/gen-tauri-commands.mjs --write

      # 不依赖 Rust 的契约门禁：85 条通道各一次、命令名==契约、参数名（camelCase）与
      # 整包结构体字段覆盖契约参数、register() 覆盖全部命令、生成物无漂移。
      - name: 契约静态校验（不含编译）
        run: node src-tauri/scripts/gen-tauri-commands.mjs --verify

      - name: 脚本语法检查
        run: |
          node --check src-tauri/scripts/gen-tauri-commands.mjs
          node --check src-tauri/scripts/prepare-resources.mjs

      - run: npm ci

      # `tauri::generate_context!()` 在编译期把 `frontendDist`（`../out/renderer`）嵌进二进制，
      # 目录不存在会直接编译失败；CI 里没有本地 api.config.json，故不跑 prepare-resources（只影响打包）。
      - name: 前端产物（编译期被嵌入）
        run: npm run build

      # 只做类型/借用检查，不出包。
      # 输出同时 tee 到文件：失败时下一步把编译错误推到 `ci-logs` 分支，便于在无 admin 权限的
      # 环境下读到完整错误（本机沙箱没有 WebKitGTK，无法本地复现壳层编译）。
      - name: cargo check
        id: shell_check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: 诊断（仅失败时：把编译错误推到 ci-logs 分支）
        if: steps.shell_check.outcome == 'failure'
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          {
            echo "# ci 壳层编译错误"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat "$RUNNER_TEMP/check.log"
            echo '```'
          } > "$RUNNER_TEMP/diag/README.md"
          cd "$RUNNER_TEMP/diag"
          git init -q
          git checkout -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "ci: shell check errors for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      # 把失败状态传递下去（continue-on-error 只是为了让「诊断」步骤有机会跑）。
      - name: 失败传递
        if: steps.shell_check.outcome == 'failure'
        run: exit 1

  # 三平台出包在 release.yml（tag 触发），CI 不跑，省时间。