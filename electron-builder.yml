appId: com.huangqisf.client
productName: hq-scifi
executableName: huangqi-scifi
directories:
  buildResources: resources
  output: dist
files:
  - out/**
asar: true
# better-sqlite3 原生 .node 必须在 asar 外，Electron 才能加载
asarUnpack:
  - node_modules/better-sqlite3/**
compression: normal

# 荒启 API 接口配置（本地持有，不入库）随包分发：打包机需先创建 api.config.json，
# 缺失时 electron-builder 会报错（提示给编译本应用的开发者）
extraResources:
  - from: api.config.json
    to: api.config.json

# 窗口标题等显示名（中文），安装器显示名用 shortcutName
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 黄芪饮片

win:
  target:
    - target: nsis
      arch: [x64]

# macOS：dmg 打包依赖 hdiutil，只能在 macOS 上构建（Mac 真机或 CI macos runner），
# 执行 npm run build:mac。未配置签名证书时产出未签名包（首次打开需右键→打开）；
# resources/ 暂无 icon.icns，会用 Electron 默认图标（与 win/linux 现状一致）。
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.productivity

linux:
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  category: Utility
  maintainer: hqsf <hqsf1904@163.com>
  synopsis: 黄芪饮片桌面客户端
  description: 黄芪饮片 —— 荒启科幻（huangqisf.com）桌面客户端，写作-阅读-评审 一站式方案。
  executableName: huangqi-scifi
  syncDesktopName: true

deb:
  packageName: hq-scifi
  artifactName: ${productName}_${version}_${arch}.${ext}
