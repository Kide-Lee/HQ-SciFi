# 迁移来源：1.x `package.json`（Electron 34 + better-sqlite3 + keytar 替代品 safeStorage 等）
# 与 Electron 的差异：
#   - Electron 版本、chromium、node 运行时由 tauri 2.12 自带的系统 WebView 取代，不再打包 chromium；
#   - 原生依赖改为纯 Rust：better-sqlite3 → rusqlite(bundled)，safeStorage → keyring(系统钥匙串)，
#     fetch/undici → reqwest(rustls)，electron-updater → 后续 updater lane（本卡不做）；
#   - 本 crate 是**独立工作区**（根 Cargo.toml 的 `[workspace].exclude` 已排除 src-tauri）：
#     本机没有 pkg-config / WebKitGTK，`cargo metadata`/`check` 会失败，所以壳层不参与内核的 workspace 构建。
# 版本对齐说明：serde/serde_json/thiserror/rusqlite 与根 `Cargo.toml` 的 workspace.dependencies 对齐
#   （serde 1、serde_json 1、thiserror 2、rusqlite 0.43 + bundled、edition 2024、rust-version 1.90、version 2.0.0）。

[package]
name = "hq-scifi"
version = "2.0.0"
description = "荒启科幻桌面客户端（Tauri 2 壳层：窗口 / 自定义协议 / 系统端口 / 命令 dispatch）"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

# 独立工作区（见文件头说明）。
[workspace]

[lib]
# 与 tauri 官方模板一致：lib 供 main.rs 调用 + 移动端 staticlib 预留。
name = "hq_scifi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# tauri-build 会在 build.rs 里生成 context / capabilities schema（gen/schemas）。
tauri-build = { version = "2", features = [] }

[dependencies]
# --- 壳层框架 ---
# 2.12：`devtools` 不默认开启。debug 构建 Tauri 自带 inspector；release 想调试用 `--features devtools`。
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2" # 实测 2.4.0
tauri-plugin-opener = "2"          # 实测 2.5.0（open_external / open_path / reveal_in_item）
tauri-plugin-dialog = "2"          # 实测 2.6.0（文件选择 / 消息框，替代 dialog.showOpenDialog/showMessageBox）
tauri-plugin-clipboard-manager = "2" # 实测 2.3.0（无 read_html，见 src/runtime/platform.rs 的降级说明）

# --- 通用 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# --- 端口实现的宿主依赖 ---
# reqwest：0.13 的 TLS feature 改名（0.12 的 `rustls-tls` → 0.13 的 `rustls`），且 tauri 自身也依赖
# reqwest ^0.13，这里保持一致。选 async client + 专用 tokio Runtime（见 src/runtime/http.rs 的 block_on 风险说明）。
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros"] }

# 本地索引库：版本/feture 与根 Cargo.toml 的 workspace.dependencies 完全一致（bundled = 静态编译 SQLite）。
rusqlite = { version = "0.43", features = ["bundled"] }

# 内核：端口 trait 与 CoreCtx 的唯一来源。
hqsf-core = { path = "../crates/hqsf-core" }

# 1.x `shell.trashItem`（回收站）在 tauri 里没有插件 API，用 trash crate（壳层依赖，不违反内核「禁新增 crate」）。
trash = "5"

# --- 系统钥匙串 ---
# TODO(verify): 任务要求 keyring 4.x。但 keyring 4.0 是破坏性改版：`Entry` 迁到 `keyring-core`，
#   且需要显式 `use_*_store()` 初始化 store；本机无法编译验证（缺 pkg-config/WebKitGTK），
#   因此先用仍提供稳定 `Entry` API 的 3.6（语义与 4.x 相同）。CI 能编译后升级到 4.x 并重写
#   src/runtime/secrets.rs 的 store 初始化。按目标平台拆 section，避免 apple/windows 专属 crate 被交叉拉入。
[target.'cfg(target_os = "linux")'.dependencies]
# crypto-rust：避免依赖系统 OpenSSL；sync-secret-service 走 libdbus（构建需 pkg-config + libdbus-1-dev）。
# 运行期没有 Secret Service（GNOME Keyring/KWallet）时 Entry 会返回 PlatformFailure，
# 壳层必须翻译成 CoreError 而不是 panic（见 secrets.rs）。
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[features]
# release 构建需要 devtools 时：`cargo build --release --features devtools`（对应 1.x 生产包也能 Ctrl+F12）。
# 默认关闭，减小体积；debug 构建不需要（Tauri 自带 inspector）。
default = []
devtools = ["tauri/devtools"]

# debug 构建下让 `cargo build` 能直接跑（需要先有 out/renderer 产物；本卡不构建）。